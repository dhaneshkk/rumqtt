# Alternative broker: Mosquitto 2.x on OpenSSL >= 3.5 (rumqttd users: set key_exchange instead).
# Mosquitto has no dedicated "groups" directive, so the PQ-only key exchange is
# enforced through OpenSSL's system config (broker/openssl-pq.cnf):
#   OPENSSL_CONF=/etc/mosquitto/openssl-pq.cnf mosquitto -c /etc/mosquitto/mosquitto.conf
# Check:  openssl s_client -connect host:8883 -groups X25519MLKEM768 -CAfile ca.pem \
#           -cert client.pem -key client.key  </dev/null | grep -i "group"
per_listener_settings true

listener 8883 0.0.0.0
protocol mqtt
tls_version tlsv1.3
cafile   /etc/mosquitto/certs/ca.pem
certfile /etc/mosquitto/certs/server.pem
keyfile  /etc/mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
allow_anonymous false
max_packet_size 65536
